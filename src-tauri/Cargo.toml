[package]
name = "sistema-de-credenciales-incluyentes"
version = "0.1.0"
description = "Sistema de Credenciales Incluyentes"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Core application dependencies
image = "0.24"
imageproc = "0.23"
ab_glyph = "0.2"
rusttype = "0.9"
qrcode = { version = "0.14", features = ["image"] }
calamine = "0.26"
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1.10"
base64 = "0.22"
printpdf = { version = "0.7", features = ["embedded_images"] }

